name: Napi scoresheet feldolgozás

# Kétóránként, nem naponta egyszer (2026-11-18). A meccs estéjén felkerülő
# jegyzőkönyv eddig másfél nappal később ért a honlapra: a lánc három lépése
# (ez → mkosz-stats import → mkosz-dashboard regen) naponta egyszer futott, és
# a GitHub a kerek percre ütemezett futásokat órákkal csúsztatja (mérve
# 2026-11-18: ez a 22:00-s futás 01:31 és 04:19 között indult, az import 6:30
# helyett 13:44 és 16:23 között). A :17 perc szándékos: a kerek óra a GitHub
# ütemezőjének a legterheltebb pillanata. A repó publikus, az Actions-perc
# ingyenes. Kihagyni nincs mit: a futás érdemi része maga a letöltés-ellenőrzés,
# a kiolvasás inkrementális, és commit csak akkor lesz, ha az adatbázis változott.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python csomagok telepítése
        run: pip install PyMuPDF requests beautifulsoup4

      - name: Cache visszaállítása (PDF-ek + SQLite)
        uses: actions/cache/restore@v4
        with:
          path: |
            pdfs/
            scoresheet.sqlite
          key: data-v1-${{ hashFiles('extract_scoresheet.py', 'download_scoresheets.py') }}-${{ github.run_number }}
          restore-keys: |
            data-v1-${{ hashFiles('extract_scoresheet.py', 'download_scoresheets.py') }}-
            data-v1-

      - name: Scoresheet feldolgozás
        run: python3 ci_update.py

      - name: Cache mentése (PDF-ek + SQLite)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            pdfs/
            scoresheet.sqlite
          key: data-v1-${{ hashFiles('extract_scoresheet.py', 'download_scoresheets.py') }}-${{ github.run_number }}

      # Nem az új PDF-ek számához kötve: ha egy korábbi futásban letöltött PDF
      # kiolvasása akkor elhasalt, most sikerülhet, és az adatbázis attól is
      # változik. A „változott-e" kérdésre a git válaszol, nem a számláló.
      - name: Commit és push ha változott
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scoresheet.sqlite
          git diff --staged --quiet || (
            git commit -m "Scoresheet frissítés (auto): $(date +%Y-%m-%d)" &&
            git push
          )
